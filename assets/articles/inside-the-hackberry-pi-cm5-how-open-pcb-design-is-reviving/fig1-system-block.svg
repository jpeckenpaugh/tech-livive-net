<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="fig1t fig1d">
  <title id="fig1t">Hackberry Pi CM5 system block diagram</title>
  <desc id="fig1d">Top-level signal map of the Hackberry Pi CM5. A CM5 (BCM2712) attaches to the carrier through two 100-pin DF40C connectors, CN3 and CN4. CN3 carries the 18-bit DPI RGB display bus, SDIO, touch I2C and housekeeping; CN4 carries PCIe Gen2, HDMI and USB 3.0. The carrier breaks these out to a 720x720 TFT panel, an RP2040 USB-HID keyboard controller with an 8x8 matrix and trackpad, an M.2 2242 socket, HDMI, two USB 3.0 ports, a power block (IP5306/IP5310/LiPo) and a MAX17048 fuel gauge. A CH440R/CH443K USB-KVM switch can reroute the keyboard to an external USB-C port.</desc>
  <style>
    text{fill:#1a1a1a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .ttl{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:600}
    .b{font-size:12px}
    .box{fill:#ffffff;stroke:#1a1a1a;stroke-width:1.6}
    .boxA{fill:#ffffff;stroke:#1f6feb;stroke-width:1.8}
    .ln{stroke:#1a1a1a;stroke-width:1.5;fill:none}
    .lnA{stroke:#1f6feb;stroke-width:1.8;fill:none}
    .mid{text-anchor:middle}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <text class="ttl" x="20" y="24">Hackberry Pi CM5 - system block diagram</text>

  <!-- Power block -->
  <rect class="boxA" x="40" y="40" width="180" height="68" rx="4"/>
  <text class="h mid" x="130" y="62">Power block</text>
  <text class="b mid" x="130" y="80">IP5306 charge - IP5310 5V</text>
  <text class="b mid" x="130" y="96">LiPo 5000 mAh - 18.5 Wh</text>
  <path class="lnA" d="M220,74 H282" marker-end="url(#aA)"/>
  <text class="b mid" x="252" y="66">5V0_IN</text>

  <!-- CM5 -->
  <rect class="box" x="290" y="40" width="180" height="68" rx="4"/>
  <text class="h mid" x="380" y="64">CM5 - BCM2712</text>
  <text class="b mid" x="380" y="82">quad Cortex-A76 @2.4 GHz</text>
  <text class="b mid" x="380" y="98">CN3 + CN4 (2 x 100-pin)</text>

  <!-- Gauge -->
  <rect class="box" x="540" y="40" width="180" height="68" rx="4"/>
  <text class="h mid" x="630" y="62">MAX17048 gauge</text>
  <text class="b mid" x="630" y="80">I2C address 0x36</text>
  <text class="b mid" x="630" y="96">state of charge</text>
  <path class="ln" d="M540,74 H478" marker-end="url(#a)"/>
  <text class="b mid" x="509" y="66">I2C</text>

  <!-- Connectors -->
  <rect class="box" x="120" y="150" width="230" height="48" rx="4"/>
  <text class="h mid" x="235" y="170">CN3 - DF40C-100DS-0.4V(51)</text>
  <text class="b mid" x="235" y="188">DPI - SDIO - touch I2C - control</text>
  <rect class="box" x="410" y="150" width="230" height="48" rx="4"/>
  <text class="h mid" x="525" y="170">CN4 - DF40C-100DS-0.4V(51)</text>
  <text class="b mid" x="525" y="188">PCIe Gen2 - HDMI - USB 3.0 - USB2</text>

  <path class="ln" d="M380,108 V126 H235 V150" marker-end="url(#a)"/>
  <path class="ln" d="M380,126 H525 V150" marker-end="url(#a)"/>

  <!-- Under CN3 -->
  <rect class="box" x="35" y="222" width="190" height="60" rx="4"/>
  <text class="h mid" x="130" y="244">720x720 TFT panel</text>
  <text class="b mid" x="130" y="262">4.0in a-Si - Y17B - RGB666</text>
  <text class="b mid" x="130" y="278">via 40-pin FPC</text>

  <rect class="box" x="245" y="222" width="190" height="60" rx="4"/>
  <text class="h mid" x="340" y="244">RP2040 keyboard ctrl (U66)</text>
  <text class="b mid" x="340" y="262">8x8 matrix - trackpad</text>
  <text class="b mid" x="340" y="278">QMK/Vial - USB HID</text>

  <rect class="box" x="35" y="300" width="190" height="52" rx="4"/>
  <text class="h mid" x="130" y="320">Backlight boost</text>
  <text class="b mid" x="130" y="338">3.3 V to ~12 V</text>

  <rect class="box" x="245" y="300" width="190" height="52" rx="4"/>
  <text class="h mid" x="340" y="320">USB-KVM switch</text>
  <text class="b mid" x="340" y="338">CH440R/CH443K to USB-C</text>

  <path class="ln" d="M205,198 V210 H130 V222" marker-end="url(#a)"/>
  <text class="b" x="150" y="212">DPI 18-bit RGB + touch I2C</text>
  <path class="ln" d="M265,198 V210 H340 V222" marker-end="url(#a)"/>
  <text class="b" x="300" y="212">USB 2.0</text>
  <path class="ln" d="M130,300 V282" marker-end="url(#a)"/>
  <path class="ln" d="M340,282 V300" marker-end="url(#a)"/>

  <!-- Under CN4 -->
  <rect class="box" x="430" y="222" width="95" height="60" rx="4"/>
  <text class="h mid" x="477" y="246">M.2 2242</text>
  <text class="b mid" x="477" y="264">NVMe</text>
  <text class="b mid" x="477" y="280">PCIe Gen2</text>
  <rect class="box" x="533" y="222" width="95" height="60" rx="4"/>
  <text class="h mid" x="580" y="246">HDMI 2.0</text>
  <text class="b mid" x="580" y="264">full-size</text>
  <text class="b mid" x="580" y="280">100 ohm</text>
  <rect class="box" x="636" y="222" width="95" height="60" rx="4"/>
  <text class="h mid" x="683" y="246">2x USB 3.0</text>
  <text class="b mid" x="683" y="264">90 ohm</text>
  <text class="b mid" x="683" y="280">pairs</text>

  <path class="ln" d="M525,198 V210 H477 V222" marker-end="url(#a)"/>
  <path class="ln" d="M525,198 V210 H580 V222" marker-end="url(#a)"/>
  <path class="ln" d="M525,198 V210 H683 V222" marker-end="url(#a)"/>

  <text class="b" x="20" y="400">RP2040 enumerates to the CM5 as a USB HID keyboard/mouse; the 720x720 panel is driven over parallel RGB (DPI), not DSI.</text>
  <text class="b" x="20" y="414">Topology after sources [s2][s7][s8][s11].</text>
</svg>
